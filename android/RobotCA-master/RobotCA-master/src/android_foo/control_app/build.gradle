def rosjavaMaven = new File(rootDir, '../../../../../tools/rosjava_mvn_repo').getCanonicalFile().toURI().toString()

buildscript {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:1.5.0'
    }
}

subprojects {
    buildscript {
        repositories {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        }
        dependencies {
            classpath 'com.android.tools.build:gradle:1.5.0'
        }
    }
    repositories {
        maven { url rosjavaMaven }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenLocal()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.application'

repositories {
    maven { url rosjavaMaven }
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenLocal()
    flatDir {
        dirs 'libs'
    }
    maven { url 'https://jitpack.io' }
}

android {
    compileSdkVersion 25
    buildToolsVersion "30.0.2"
    packagingOptions {
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
    }
    defaultConfig {
        applicationId project.hasProperty('appId') ? project.appId : "com.robotca.ControlApp"
        minSdkVersion 15
        targetSdkVersion 23
        multiDexEnabled true
        versionCode 2
        versionName project.hasProperty('appVersionName') ? project.appVersionName : "1.0-xtark"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    sourceSets {
        main { java.srcDirs = ['src/main/java'] }
        debug { java.srcDirs = ['src/debug/java'] }
    }
}

dependencies {
    compile fileTree(include: ['*.jar'], dir: 'libs')
    compile 'org.ros.android_core:android_10:0.2.1'
    compile 'org.ros.android_core:android_15:0.2.1'
    compile 'com.github.rosjava.android_extras:gingerbread:0.2.0'
    compile 'org.ros.rosjava_messages:tf2_msgs:0.5.13'
    compile 'org.ros.rosjava_messages:actionlib_msgs:1.12.7'
    compile 'com.google.code.gson:gson:2.5'
    compile 'com.android.support:support-v13:23.2.0'
    compile 'com.android.support:appcompat-v7:23.2.0'
    compile 'com.android.support:cardview-v7:23.2.0'
    compile 'com.android.support:recyclerview-v7:23.2.0'
    compile 'org.osmdroid:osmdroid-android:5.2@aar'
    compile(name:'osmbonuspack_v5.8.1', ext:'aar')
    compile 'org.apache.commons:commons-lang3:3.3.2'
    compile 'com.squareup.okhttp:okhttp:2.6.0'
    compile 'com.android.support:support-v4:23.2.0'
    compile 'com.github.amlcurran.showcaseview:library:5.4.1'
    compile project(':control_app_lib')

    // Required -- JUnit 4 framework
    testCompile 'junit:junit:4.12'
    // Optional -- Mockito framework
    testCompile 'org.mockito:mockito-core:1.10.19'

    androidTestCompile 'com.android.support:support-annotations:23.2.0'
    androidTestCompile 'com.android.support.test:runner:0.4'
    androidTestCompile 'com.android.support.test:rules:0.4'
    // Optional -- Hamcrest library
    androidTestCompile 'org.hamcrest:hamcrest-library:1.3'
    // Optional -- UI testing with Espresso
    androidTestCompile 'com.android.support.test.espresso:espresso-core:2.2.1'
    // Optional -- UI testing with UI Automator
//    androidTestCompile 'com.android.support.test.uiautomator:uiautomator-v15'
}

// Needed to resolve app vs test dependencies, specifically, transitive dependencies of
// libraryq and libraryz. Forcing the use of the smaller version after regression testing.
configurations.all {
    exclude group: 'xml-apis', module: 'xml-apis'
    resolutionStrategy.force 'com.google.code.findbugs:jsr305:1.3.9'
}
